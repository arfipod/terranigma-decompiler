name: Package ROM-free Android toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-android-toolchain.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PLATFORM="$(find "$ANDROID_SDK_ROOT/platforms" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "NDK=$NDK BT=$BT PLATFORM=$PLATFORM"
      - name: Package slim host toolchain
        shell: bash
        run: |
          set -euxo pipefail
          PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p out/ndk/bin out/ndk/lib out/ndk/sysroot out/sdk/build-tools out/sdk/platform
          for f in clang clang++ ld.lld llvm-ar llvm-ranlib llvm-strip llvm-readelf; do cp -L "$PRE/bin/$f" out/ndk/bin/; done
          cp -a "$PRE/lib/clang" out/ndk/lib/
          cp -a "$PRE/sysroot/." out/ndk/sysroot/
          for f in aapt2 apksigner zipalign d8; do cp -L "$BT/$f" out/sdk/build-tools/; done
          cp "$PLATFORM/android.jar" out/sdk/platform/
          printf 'NDK=%s\nBUILD_TOOLS=%s\nPLATFORM=%s\n' "$NDK" "$BT" "$PLATFORM" > out/VERSIONS.txt
          du -sh out out/ndk/bin out/ndk/lib out/ndk/sysroot
      - uses: actions/upload-artifact@v4
        with:
          name: android-local-arm64-toolchain-slim
          path: out
          retention-days: 2
