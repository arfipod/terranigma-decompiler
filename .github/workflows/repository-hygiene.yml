name: Repository hygiene

on:
  push:
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ROMs and generated game content
        run: bash scripts/check_repo_hygiene.sh
      - name: Syntax-check ROM verifier
        run: python3 -m py_compile tools/verify_rom.py
